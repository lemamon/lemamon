# CI do site (dono: shell) — backlog B240, B276, B255.
# Roda em todo pull request e em push na main. O deploy NÃO sai daqui: quem
# publica é o Netlify (netlify.toml), com deploy preview por PR.
#
# Gate de qualidade, nesta ordem: install congelado → paridade do i18n →
# lint de código (yarn lint = scripts/lint.mjs, B251: no-unnecessary-type-
# assertion com tipo, no-console/no-debugger em src/, jsx-a11y/alt-text nas
# ilhas) → astro check (TypeScript strict) → testes unitários (inclui o lint de
# copy do i18n, B302) → build (verify-build: rotas, H1, placeholders, orçamento
# de peso de todo CSS/JS do site, terceiros só da lista, scripts inline) → E2E
# (Playwright, desktop e mobile, contra o build). Formatação (Prettier) ainda
# não é gate: pede uma reformatação única do projeto antes (B251).
# O mesmo lint roda no pre-commit (.githooks/pre-commit, ligado no yarn install
# por scripts/git-hooks.mjs); aqui ele pega quem commitou com --no-verify.
#
# Branch protection (o dono liga em GitHub › Settings › Branches › main):
# exigir o status check "CI / build, testes e E2E" e "Require branches to be up
# to date" antes do merge. É ele que segura o automerge de patches do Renovate
# (renovate.json). Aceite: um PR com erro de tipo proposital fica com o botão
# Merge bloqueado.
#
# B276, aceite: um PR de teste com (a) erro de tipo num .ts, (b) console.log em
# src/ e (c) asserção de E2E quebrada fica com este check vermelho (passos
# astro check, Lint e E2E) e o Merge bloqueado pela proteção da main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: build, testes e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # O site real (dados/dono.json), sem a camada de dados fictícios.
      PUBLIC_DADOS_FICTICIOS: "false"
    steps:
      - uses: actions/checkout@v4

      # Astro 7 exige Node >= 22.22 (package.json › engines; Netlify usa NODE_VERSION 22).
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: yarn

      # Yarn 1.22.22 do package.json › packageManager.
      - run: corepack enable

      - name: Install congelado
        run: yarn install --frozen-lockfile

      - name: Paridade do i18n
        run: yarn i18n:check

      - name: Lint
        run: yarn lint

      # `yarn run check`, nunca `yarn check` (comando nativo do Yarn 1 que não roda o script).
      - name: astro check
        run: yarn run check

      - name: Testes unitários
        run: yarn test

      # Sem CONTEXT: build "local" (a trava de privacidade e o WhatsApp de
      # produção só valem com CONTEXT=production, no Netlify).
      - name: Build
        run: yarn build

      - name: Navegador do Playwright
        run: yarn playwright install --with-deps chromium

      - name: E2E
        run: yarn test:e2e
        env:
          CI: "1"

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
